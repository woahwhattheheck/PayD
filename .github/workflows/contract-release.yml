name: Publish contracts

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-domain:
    runs-on: ubuntu-latest
    env:
      PAYD_HOME_DOMAIN: ${{ vars.PAYD_HOME_DOMAIN }}
    steps:
      - name: Require a real contract home domain
        shell: bash
        run: |
          domain="${PAYD_HOME_DOMAIN,,}"
          if [[ -z "$domain" || "$domain" == example || "$domain" == *.example ||
                "$domain" == test || "$domain" == *.test || "$domain" == invalid || "$domain" == *.invalid ||
                "$domain" == localhost || "$domain" == *.localhost ||
                "$domain" == *yourdomain* || "$domain" == *your-domain* ||
                "$domain" == *://* || "$domain" == */* || "$domain" =~ [[:space:]] ||
                ! "$domain" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$ ]]; then
            echo "::error::Set PAYD_HOME_DOMAIN to the verified production DNS name before releasing contracts"
            exit 1
          fi

  release-contract:
    needs: validate-domain
    name: Compile ${{ matrix.package }} and create release
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: bulk_payment
            relative_path: contracts/bulk_payment
          - package: revenue_split
            relative_path: contracts/revenue_split
          - package: cross_asset_payment
            relative_path: contracts/cross_asset_payment
          - package: vesting_escrow
            relative_path: contracts/vesting_escrow
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@2ff8e0a5a122981b534bfc76851d26d74905c1cc
    with:
      release_name: ${{ github.ref_name }}-${{ matrix.package }}
      release_description: "PayD ${{ matrix.package }} contract release"
      home_domain: ${{ vars.PAYD_HOME_DOMAIN }}
      relative_path: ${{ matrix.relative_path }}
      package: ${{ matrix.package }}
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
