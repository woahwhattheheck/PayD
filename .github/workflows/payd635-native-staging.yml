name: Retain native staging evidence
on:
  push:
    branches: [validation/payd635-native-staging-relay5692]
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Preserve the completed run without rerunning tests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          archive=evidence/payd635-native-staging-20261004.zip
          if [ ! -f "$archive" ]; then
            gh api repos/woahwhattheheck/PayD/actions/artifacts/11298695472/zip > "$archive"
          fi
          echo '1a56f81b00dad1e1d1562c644669915b1704f8230fdac7f406a7e5c3d7bed4e4  evidence/payd635-native-staging-20261004.zip' | sha256sum --check
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          p = pathlib.Path('evidence/payd635-native-staging-20261004.zip')
          assert p.stat().st_size == 12395
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              members = {name: z.read(name) for name in z.namelist()}
          text = lambda name: members[name].decode().strip()
          source = text('source-tools.txt').splitlines()
          assert source[:2] == ['dbff07d69223bc699c3af03b2d0ba57dee82dc05', 'c83c0cca26c10c8a9ca85a992dd7127ab3870492']
          assert text('seed-counts-before.txt') == text('seed-counts-after.txt') == '1|5|5|39|1'
          assert text('auth-status.txt').splitlines() == ['Anonymous /api/employees: 401', 'Anonymous /api/admin: 401']
          assert 'Engine: native PostgreSQL using restricted application login' in text('native-rls-http.log')
          receipt = {
              'source_sha': source[0], 'source_tree': source[1],
              'run_id': 37189968962, 'job_id': 111399914243,
              'controller_sha': '11f97e3f8dbf914df4d4610d48138a6a727924cd',
              'run_url': 'https://github.com/woahwhattheheck/PayD/actions/runs/37189968962',
              'artifact_id': 11298695472,
              'archive_sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              'archive_bytes': p.stat().st_size,
              'node_version': text('node-version.txt'),
              'postgres_version': text('postgres-version.txt'),
              'seed_counts_before_and_after': dict(zip(['organizations', 'employees', 'transactions', 'migrations', 'seed_markers'], map(int, text('seed-counts-before.txt').split('|')))),
              'archive_members_sha256': {name: hashlib.sha256(data).hexdigest() for name, data in sorted(members.items())},
              'limits': ['Local disposable staging only', 'SDS disabled and Stellar endpoints loopback', 'No live chain, external Horizon readiness, full suite, load benchmark or multi-client concurrency claim'],
          }
          pathlib.Path('evidence/native-acceptance.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- evidence/
          if ! git diff --cached --quiet; then
            git commit -m 'Retain completed native staging execution evidence [skip ci]'
            git push origin HEAD:refs/heads/validation/payd635-native-staging-relay5692
          fi
          git rev-parse HEAD
