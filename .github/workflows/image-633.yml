name: Focused backend image 633
on:
  push:
    branches: [validation/payd633-image-rill-20261004]
permissions:
  contents: read
concurrency:
  group: payd633-image-rill-20261004
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 55b4bc5a9cc1ca234610c17581acb35f31fbe842
          path: source
          persist-credentials: false
      - name: Build original and ownership-at-creation image
        run: python3 measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payd633-image-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
