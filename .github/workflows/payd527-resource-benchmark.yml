name: PayD 527 resource benchmark

on:
  push:
    branches:
      - sol56/payd527-direct-transfer-gas-20261004
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: Soroban bulk-payment resource benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32v1-none
      - name: Run focused issue 527 benchmark
        shell: bash
        run: |
          set +e
          cargo test -p bulk_payment benchmark_issue_527_resource_profile -- --nocapture 2>&1 | tee /tmp/payd527-benchmark.log
          status=${PIPESTATUS[0]}
          echo "${status}" > /tmp/payd527-benchmark.status
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "exit_status=${status}"
            grep 'PAYD527 ' /tmp/payd527-benchmark.log || true
            if [ "${status}" -ne 0 ]; then
              echo "--- failure tail ---"
              tail -n 80 /tmp/payd527-benchmark.log
            fi
          } > .github/payd527-benchmark-receipt.txt
          exit 0
      - name: Persist benchmark receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/payd527-benchmark-receipt.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(bench): persist issue 527 resource receipt [skip ci]"
          git push
      - name: Enforce benchmark result
        shell: bash
        run: |
          status="$(cat /tmp/payd527-benchmark.status)"
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
