name: Validate PayD 500 replay residual

on:
  push:
    branches:
      - validation/payd-500-replay-1845

jobs:
  focused-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Focused idempotency suites
        run: npm test -- --runInBand src/services/__tests__/idempotencyService.test.ts src/middleware/__tests__/idempotencyMiddleware.test.ts
      - name: Backend TypeScript build
        run: npm run build
