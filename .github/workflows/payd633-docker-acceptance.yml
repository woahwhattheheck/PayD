name: PayD 633 Docker acceptance
on:
  push:
    branches: [validation/payd633-docker-ledger0938]
permissions:
  contents: read
concurrency:
  group: payd633-docker-ledger0938
  cancel-in-progress: false
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: 16b3e8a4a967fe403dc313956a92214b172ed966
      DOCKERFILE_BLOB: 22464e99c7126c051d674a34ff15e6ed5fa60424
      IMAGE: payd633:source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 16b3e8a4a967fe403dc313956a92214b172ed966
          persist-credentials: false
      - name: Pin source and record Docker tools
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object backend/Dockerfile)" = "$DOCKERFILE_BLOB"
          { git rev-parse HEAD HEAD^{tree}; git ls-tree HEAD backend/Dockerfile backend/package.json backend/package-lock.json backend/tsconfig.json backend/.dockerignore; docker version; docker buildx version; } > evidence/source-tools.txt
          cp backend/Dockerfile evidence/Dockerfile
      - name: Build the unchanged contribution image
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e' -o evidence/first-build-seconds.txt \
            docker build --pull --progress=plain --tag "$IMAGE" backend 2>&1 | tee evidence/first-build.log
          docker image inspect "$IMAGE" > evidence/image-inspect.json
          docker history --no-trunc "$IMAGE" > evidence/image-history.txt
          docker run --rm --network none --entrypoint sh "$IMAGE" -c 'id -u; cat /etc/alpine-release' > evidence/runtime-identity.txt
          docker run --rm --network none --entrypoint sh "$IMAGE" -c 'du -k -d 2 /usr/src/app/node_modules /usr/local /opt 2>/dev/null | sort -nr | head -60' > evidence/runtime-footprint.txt
      - name: Exercise the retained Node runtime and package entrypoints
        run: |
          set -euo pipefail
          docker run --rm -i --network none "$IMAGE" node --input-type=module > evidence/runtime-smoke.json <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          const require = createRequire(process.cwd() + '/package.json');
          assert.match(process.version, /^v20\./);
          const { Keypair } = require('@stellar/stellar-sdk');
          const { Keypair: BaseKeypair } = require('@stellar/stellar-base');
          const message = Buffer.from('PayD Docker 529 runtime smoke');
          const keypair = Keypair.fromRawEd25519Seed(Buffer.alloc(32, 7));
          const signature = keypair.sign(message);
          assert.equal(keypair.verify(message, signature), true);
          assert.equal(BaseKeypair.fromPublicKey(keypair.publicKey()).verify(message, signature), true);
          const ExcelJS = require('exceljs');
          const workbook = new ExcelJS.Workbook();
          workbook.addWorksheet('smoke').getCell('A1').value = 'PayD #529';
          const xlsx = await workbook.xlsx.writeBuffer();
          const restored = new ExcelJS.Workbook();
          await restored.xlsx.load(xlsx);
          assert.equal(restored.getWorksheet('smoke').getCell('A1').value, 'PayD #529');
          const sodium = require('sodium-native');
          const random = Buffer.alloc(32);
          sodium.randombytes_buf(random);
          assert.equal(random.some(value => value !== 0), true);
          console.log(JSON.stringify({
            passed: true,
            node_version: process.version,
            stellar_sign_verify: true,
            stellar_base_verify: true,
            exceljs_xlsx_roundtrip: true,
            sodium_native_randombytes: true
          }, null, 2));
          JS
          cat evidence/runtime-smoke.json
      - name: Rebuild after a temporary source-only change
        run: |
          set -euo pipefail
          git hash-object backend/src/index.ts > evidence/cache-probe-before-blob.txt
          printf '\n// Temporary source-only Docker dependency-cache probe.\n' >> backend/src/index.ts
          git diff --name-only > evidence/cache-probe-paths.txt
          test "$(cat evidence/cache-probe-paths.txt)" = backend/src/index.ts
          git diff -- backend/src/index.ts > evidence/cache-probe.diff
          /usr/bin/time -f '%e' -o evidence/cached-build-seconds.txt \
            docker build --progress=plain --tag payd633:cache-probe backend 2>&1 | tee evidence/cached-build.log
      - name: Evaluate the explicit Docker acceptance criteria
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          evidence = pathlib.Path('evidence')
          image = json.loads((evidence / 'image-inspect.json').read_text())[0]
          runtime_smoke = json.loads((evidence / 'runtime-smoke.json').read_text())
          first = (evidence / 'first-build.log').read_text()
          cached = (evidence / 'cached-build.log').read_text()
          identity = (evidence / 'runtime-identity.txt').read_text().splitlines()
          dockerfile = (evidence / 'Dockerfile').read_text()
          dependencies = []
          for match in re.finditer(r'^#(\d+) \[(builder|production-deps) [^\]]+\] RUN npm ci([^\n]*)$', cached, re.M):
              step, stage, command_tail = match.groups()
              dependencies.append({'step': step, 'stage': stage, 'command': 'npm ci' + command_tail,
                                   'cached': bool(re.search(r'^#' + step + r' CACHED\s*$', cached, re.M))})
          froms = re.findall(r'^FROM\s+(\S+)\s+AS\s+(\S+)\s*$', dockerfile, re.M | re.I)
          report = {
              'source_commit': os.environ['SOURCE_SHA'],
              'dockerfile_blob': os.environ['DOCKERFILE_BLOB'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'base_digests_from_build': sorted(set(re.findall(r'node:20-alpine@(sha256:[a-f0-9]{64})', first))),
              'final_alpine_base_digests_from_build': sorted(set(re.findall(r'alpine:3\.23@(sha256:[a-f0-9]{64})', first))),
              'image_id': image['Id'],
              'size_uncompressed_bytes': image['Size'],
              'size_limit_bytes': 200000000,
              'configured_user': image['Config'].get('User'),
              'observed_uid': int(identity[0]),
              'alpine_release': identity[1],
              'healthcheck': image['Config'].get('Healthcheck'),
              'stages': froms,
              'dependency_cache_steps': dependencies,
              'first_build_seconds': float((evidence / 'first-build-seconds.txt').read_text()),
              'source_change_build_seconds': float((evidence / 'cached-build-seconds.txt').read_text()),
              'cache_probe': 'one temporary comment in backend/src/index.ts; first image and product source unchanged',
              'runtime_smoke': runtime_smoke,
              'runtime_scope': 'id, Alpine release, Node version, Stellar sign/verify, ExcelJS XLSX buffer roundtrip, sodium-native randombytes; application/database health was not executed',
          }
          report['criteria'] = {
              'under_200MB': report['size_uncompressed_bytes'] < report['size_limit_bytes'],
              'non_root': report['observed_uid'] != 0 and bool(report['configured_user']),
              'healthcheck_configured': bool((report['healthcheck'] or {}).get('Test')),
              'multi_stage_alpine': len(froms) >= 2 and all('alpine' in base for base, _ in froms),
              'both_dependency_layers_cached': len(dependencies) == 2 and {x['stage'] for x in dependencies} == {'builder', 'production-deps'} and all(x['cached'] for x in dependencies),
              'base_digest_recorded': bool(report['base_digests_from_build']),
              'final_alpine_base_digest_recorded': bool(report['final_alpine_base_digests_from_build']),
              'runtime_smoke_passed': runtime_smoke.get('passed') is True,
          }
          report['passed'] = all(report['criteria'].values())
          (evidence / 'result.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          raise SystemExit(0 if report['passed'] else 1)
          PY
      - name: Retain logs and measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payd633-docker-acceptance-ledger0938
          path: evidence/
          retention-days: 7
          if-no-files-found: error
