name: PayD 554 focused vesting cases

on:
  push:
    branches: [validate/payd554-kestrel27]

permissions:
  contents: read

concurrency:
  group: payd554-focused
  cancel-in-progress: true

jobs:
  vesting-edge-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          git hash-object contracts/vesting_escrow/tests/vesting_edge_cases.rs
          rustup toolchain install stable --profile minimal
          rustc +stable -Vv
      - name: Run the requested vesting edge cases only
        run: cargo +stable test -p vesting_escrow --test vesting_edge_cases
