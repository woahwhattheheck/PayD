name: Kubernetes Secrets Check

on:
  push:
    branches: ["main"]
    paths:
      - "k8s/**"
  pull_request:
    branches: ["main"]
    paths:
      - "k8s/**"

# Retention policy: Keep successful runs for 30 days, failed/cancelled for 7 days
jobs:
  check-secrets-placeholders:
    name: Verify no real secrets in k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend-secret.yaml for non-placeholder values
        run: ./scripts/check-k8s-secrets.sh

# Workflow run retention settings
retention-days: 30