name: Kubernetes Secrets Check

on:
  push:
    branches: ["main"]
    paths:
      - "k8s/**"
  pull_request:
    branches: ["main"]
    paths:
      - "k8s/**"

jobs:
  check-secrets-placeholders:
    name: Verify no real secrets in k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check k8s manifests for plaintext Secret values
        run: |
          set -euo pipefail
          if [ -f ./scripts/check-k8s-secrets.sh ]; then
            ./scripts/check-k8s-secrets.sh
          else
            echo "scripts/check-k8s-secrets.sh missing; inline check"
            if [ -f k8s/base/backend-secret.yaml ]; then
              echo "plaintext k8s/base/backend-secret.yaml must not be committed"
              exit 1
            fi
            if grep -RInE 'kind:[[:space:]]*Secret' k8s/base --include='*.yaml' --include='*.yml'; then
              echo "k8s/base must not contain a Kubernetes Secret manifest"
              exit 1
            fi
            if [ -f k8s/examples/backend-secret.example.yaml ]; then
              if grep -Eiq 'CHANGE_ME|sk_live|sk_test|AKIA[0-9A-Z]{16}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' k8s/examples/backend-secret.example.yaml; then
                echo "example secret file looks like it contains live-looking material"
                exit 1
              fi
            fi
            echo "k8s secret check passed"
          fi
