name: PayD 540 backend lock and focused verification

on:
  push:
    branches:
      - sol56/payd540-backend-sentry-20261005

permissions:
  contents: write

jobs:
  backend-sentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Resolve backend lockfile
        working-directory: backend
        run: npm install --package-lock-only

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Focused Sentry tests
        working-directory: backend
        run: npm test -- --runInBand src/observability/__tests__/sentry.test.ts

      - name: Compile backend
        working-directory: backend
        run: npm run build

      - name: Commit generated backend lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "backend/package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore(backend): sync Sentry lockfile"
          git push
