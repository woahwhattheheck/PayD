name: PayD 516 revenue split validation once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  revenue-split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol56/payd516-rounding-dust-20261004
      - uses: dtolnay/rust-toolchain@stable
      - name: Test revenue_split
        run: cargo test -p revenue_split
