version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        update-types:
          - minor
          - patch
    ignore:
      # Generated scaffold packages — not checked into the repo
      - dependency-name: "packages/guess_the_number"
      - dependency-name: "packages/fungible_allowlist_example"
      - dependency-name: "packages/nft_enumberable_example"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend-npm-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      backend-npm-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
