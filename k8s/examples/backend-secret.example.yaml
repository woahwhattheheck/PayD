# EXAMPLE ONLY — do not apply this file with real values, and do not commit
# real credentials. Prefer External Secrets (see k8s/base/external-secret.yaml)
# or: kubectl create secret generic payd-backend-secrets ...
apiVersion: v1
kind: Secret
metadata:
  name: payd-backend-secrets
  labels:
    app: payd
    component: backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://payd_user:REPLACE_AT_APPLY_TIME@postgres:5432/payd_db"
  DB_USER: "payd_user"
  DB_PASSWORD: "REPLACE_AT_APPLY_TIME"
  JWT_SECRET: "REPLACE_AT_APPLY_TIME"
  STELLAR_SECRET_KEY: "REPLACE_AT_APPLY_TIME"
  ANCHOR_API_KEY: "REPLACE_AT_APPLY_TIME"
  SDS_API_KEY: "REPLACE_AT_APPLY_TIME"
