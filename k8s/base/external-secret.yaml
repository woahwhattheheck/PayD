apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payd-backend-secrets
  labels:
    app: payd
    component: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: payd-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: payd-production/database-url
    - secretKey: DB_USER
      remoteRef:
        key: payd-production/db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payd-production/db-credentials
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: payd-production/jwt-secret
    - secretKey: STELLAR_SECRET_KEY
      remoteRef:
        key: payd-production/stellar-credentials
    - secretKey: ANCHOR_API_KEY
      remoteRef:
        key: payd-production/anchor-api-key
    - secretKey: SDS_API_KEY
      remoteRef:
        key: payd-production/sds-api-key
