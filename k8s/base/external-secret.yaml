apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payd-backend-secrets
  labels:
    app: payd
    component: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: payd-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: payd-production/db-credentials
        property: database_url
    - secretKey: DB_USER
      remoteRef:
        key: payd-production/db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payd-production/db-credentials
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: payd-production/jwt-secret
        property: jwt_secret
    - secretKey: STELLAR_SECRET_KEY
      remoteRef:
        key: payd-production/stellar-credentials
        property: stellar_secret_key
    - secretKey: ANCHOR_API_KEY
      remoteRef:
        key: payd-production/api-keys
        property: anchor_api_key
    - secretKey: SDS_API_KEY
      remoteRef:
        key: payd-production/api-keys
        property: sds_api_key
