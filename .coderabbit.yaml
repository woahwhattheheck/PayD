# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/target/**"
    - "!**/coverage/**"
    - "!**/.vite/**"
    - "!**/*.lock"

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: true
    base_branches:
      - ".*"

  tools:
    eslint:
      enabled: true
    clippy:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true
