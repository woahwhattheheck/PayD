{{- if .Values.backend.enabled }}
{{- $config := .Values.backend.config | default dict }}
{{- range $key, $path := dict "STELLAR_NETWORK_PASSPHRASE" "stellar.passphrase" "STELLAR_HORIZON_URL" "stellar.horizonUrl" "SOROBAN_RPC_URL" "stellar.sorobanRpcUrl" }}
{{- if hasKey $config $key }}
{{- fail (printf "backend.config.%s duplicates a chart-managed key; set %s instead" $key $path) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payd.fullname" . }}-backend-config
  labels:
    {{- include "payd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  STELLAR_NETWORK_PASSPHRASE: {{ .Values.stellar.passphrase | quote }}
  STELLAR_HORIZON_URL: {{ .Values.stellar.horizonUrl | quote }}
  SOROBAN_RPC_URL: {{ .Values.stellar.sorobanRpcUrl | quote }}
{{- end }}
