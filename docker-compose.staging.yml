# Isolated staging stack. Run with the same env file on every Compose command:
# docker compose --env-file backend/.env.staging -f docker-compose.staging.yml up --build
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: [node, staging/start.mjs]
    ports:
      - '3101:3001'
    # Do not use env_file here: it would expose the migration owner's password
    # to the API alongside the deliberately unprivileged application password.
    environment:
      PORT: '3001'
      NODE_ENV: production
      APP_ENV: staging
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${STAGING_DB_USER:-payd_staging}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      DB_NAME: ${STAGING_DB_NAME:-payd_staging}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      REQUIRE_AUTH: 'true'
      ENABLE_RLS: 'true'
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: info
      ENABLE_CACHING: 'true'
      CACHE_TTL: '3600'
      STELLAR_NETWORK_PASSPHRASE: '${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}'
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      SDS_API_KEY: ${SDS_API_KEY:-}
      SDS_ENDPOINT: ${SDS_ENDPOINT:-https://sds-api.stellar.org}
      SDS_ENABLE: ${SDS_ENABLE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [payd_staging_network]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      STAGING_DB_ADMIN_USER: ${STAGING_DB_ADMIN_USER:-payd_staging_owner}
      STAGING_DB_ADMIN_PASSWORD: ${STAGING_DB_ADMIN_PASSWORD:?Set STAGING_DB_ADMIN_PASSWORD}
      STAGING_DB_USER: ${STAGING_DB_USER:-payd_staging}
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD}
      STAGING_DB_NAME: ${STAGING_DB_NAME:-payd_staging}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [payd_staging_network]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${STAGING_DB_ADMIN_USER:-payd_staging_owner}
      POSTGRES_PASSWORD: ${STAGING_DB_ADMIN_PASSWORD:?Set STAGING_DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${STAGING_DB_NAME:-payd_staging}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [payd_staging_network]

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [payd_staging_network]

volumes:
  postgres_staging_data:
  redis_staging_data:

networks:
  payd_staging_network:
    driver: bridge
