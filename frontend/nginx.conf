server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these files. Missing assets must not become HTML or
    # receive a long-lived cache header.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must always reflect the currently deployed asset hashes.
    # Internal SPA redirects also pass through this exact location.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Public files outside /assets are not necessarily content-addressed.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
